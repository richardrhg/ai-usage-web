[project]
name = "ai-usage-web-backend"
version = "2.0.0"
description = "Multi-user remote AI subscription usage monitor with automatic OAuth token refresh (Claude, ChatGPT/Codex, Gemini)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.30.0,<1.0.0",
    "httpx>=0.27.0,<1.0.0",
    "cryptography>=41.0.0,<47.0.0",
    "pydantic>=2.7.0,<3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<10.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
